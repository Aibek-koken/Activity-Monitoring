spring:
  application:
    name: easylang-activity-monitoring
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/easylang}
    username: ${DB_USERNAME:easylang}
    password: ${DB_PASSWORD:easylang_dev_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  seed-demo-users: ${SEED_DEMO_USERS:true}
  security:
    jwt-secret: ${JWT_SECRET:ZWFzeWxhbmctZGV2ZWxvcG1lbnQtc2VjcmV0LWNoYW5nZS1tZS0yMDI2}
    token-ttl: ${JWT_TTL:PT8H}
    secure-cookie: ${SECURE_COOKIE:false}
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
