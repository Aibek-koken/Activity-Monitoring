spring:
  application:
    name: easylang-activity-monitoring
  servlet:
    multipart:
      max-file-size: ${DOCUMENT_STORAGE_MULTIPART_MAX_FILE_SIZE:21MB}
      max-request-size: ${DOCUMENT_STORAGE_MULTIPART_MAX_REQUEST_SIZE:22MB}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/easylang}
    username: ${DB_USERNAME:easylang}
    password: ${DB_PASSWORD:easylang_dev_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  seed-demo-users: ${SEED_DEMO_USERS:true}
  seed-demo-portfolio: ${APP_SEED_DEMO_PORTFOLIO:true}
  business-zone: ${BUSINESS_ZONE:Asia/Almaty}
  document-storage:
    root: ${DOCUMENT_STORAGE_ROOT:./data/review-documents}
    max-size-bytes: ${DOCUMENT_STORAGE_MAX_SIZE_BYTES:20971520}
  reminders:
    scheduling-enabled: ${REMINDER_SCHEDULING_ENABLED:true}
  security:
    jwt-secret: ${JWT_SECRET:ZWFzeWxhbmctZGV2ZWxvcG1lbnQtc2VjcmV0LWNoYW5nZS1tZS0yMDI2}
    token-ttl: ${JWT_TTL:PT8H}
    secure-cookie: ${SECURE_COOKIE:false}
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
