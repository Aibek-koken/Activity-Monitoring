spring:
  datasource:
    url: jdbc:h2:mem:easylang;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  seed-demo-users: true
  security:
    secure-cookie: false
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
